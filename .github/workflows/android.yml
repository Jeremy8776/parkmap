name: Build Android APK

# Versioned tags produce signed, updateable APKs. Publishing is separate from prod deployment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: echo "VERSION_CODE=$(python scripts/release_version.py "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Sync the built site into the Android project
        run: npx cap sync android
      - name: Restore signing key
        env:
          PARKMAP_KEYSTORE_B64: ${{ secrets.PARKMAP_KEYSTORE_B64 }}
        run: |
          test -n "$PARKMAP_KEYSTORE_B64" || { echo 'Missing signing key'; exit 1; }
          printf '%s' "$PARKMAP_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/parkmap-release.p12"
          echo "PARKMAP_KEYSTORE_FILE=$RUNNER_TEMP/parkmap-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        env:
          PARKMAP_SIGNING_PASSWORD: ${{ secrets.PARKMAP_SIGNING_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest assembleRelease --no-daemon -PparkmapVersionCode="$VERSION_CODE" -PparkmapVersionName="${GITHUB_REF_NAME#v}"
      - name: Verify release certificate
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk |
            grep -F 'Signer #1 certificate SHA-256 digest: 4fef00f85b48a0efb9fe4e26d09274ee9dbc3e502264d7efb24d69fe22564d07'
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "parkmap-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: parkmap-signed-apk
          path: parkmap-*.apk
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: parkmap-*.apk
          prerelease: true
