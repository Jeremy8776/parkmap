name: Build Android APK

# Run it by hand from the Actions tab, or push a tag like v0.1.0 to build and attach the APK to a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Sync the built site into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk newham-parking-${{ github.ref_name }}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: newham-parking-debug-apk
          path: newham-parking-*-debug.apk
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: newham-parking-*-debug.apk
          prerelease: true
